# Render deployment configuration for Campus Management System backend
# Updated for Render deployment with proper build and start commands
services:
  - type: web
    name: campus-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: CORS_ORIGINS
        value: "https://campus-management-system-ten.vercel.app,https://campus-management-system-git-deploy-r-4b7e77-avin-rajs-projects.vercel.app,https://campus-management-system-jm6ktfcdz-avin-rajs-projects.vercel.app"
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: "campusDB"
      - key: JWT_SECRET
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      # Add health check configuration for Render
      - key: HEALTH_CHECK_PATH
        value: "/healthz"
      - key: HEALTH_CHECK_TIMEOUT
        value: "5"