<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <meta name="description" content="Campus Sahayak - Student Portal" />
        <title>Campus Sahayak</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>

        <script>
            // Keep the production branding consistent without changing application logic.
            (function () {
                const replaceBranding = () => {
                    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
                    const nodes = [];
                    while (walker.nextNode()) nodes.push(walker.currentNode);
                    nodes.forEach((node) => {
                        if (node.nodeValue && node.nodeValue.includes('Campus Management System')) {
                            node.nodeValue = node.nodeValue.replace(/Campus Management System/g, 'Campus Sahayak');
                        }
                    });
                };

                const observer = new MutationObserver(replaceBranding);
                observer.observe(document.body, { childList: true, subtree: true, characterData: true });
                replaceBranding();
            })();
        </script>
    </body>
</html>
