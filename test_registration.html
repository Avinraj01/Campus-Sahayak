<!DOCTYPE html>
<html>
<head>
    <title>Registration Test</title>
</head>
<body>
    <h1>Registration Test</h1>
    <button onclick="testRegistration()">Test Registration</button>
    <div id="result"></div>

    <script>
        async function testRegistration() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            const data = {
                email: 'test5@example.com',
                password: 'testpass123',
                user_type: 'student',
                full_name: 'Test User 5',
                phone: '1234567890'
            };
            
            try {
                console.log('Sending registration request to:', 'http://localhost:8000/api/auth/register');
                console.log('Data:', data);
                
                const response = await fetch('http://localhost:8000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });
                
                console.log('Response status:', response.status);
                console.log('Response headers:', response.headers);
                
                if (response.ok) {
                    const result = await response.json();
                    console.log('Success:', result);
                    resultDiv.innerHTML = `<h3>✅ Registration Successful!</h3><pre>${JSON.stringify(result, null, 2)}</pre>`;
                } else {
                    const error = await response.text();
                    console.error('Error response:', error);
                    resultDiv.innerHTML = `<h3>❌ Registration Failed</h3><p>Status: ${response.status}</p><pre>${error}</pre>`;
                }
            } catch (error) {
                console.error('Network error:', error);
                resultDiv.innerHTML = `<h3>❌ Network Error</h3><p>${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
